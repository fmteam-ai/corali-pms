packages:
  - "."

allowBuilds:
  unrs-resolver: true

# GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, no patched release yet) reaches only the ESLint config
# (devDependency: eslint-config-next → @next/eslint-plugin-next → fast-glob → micromatch → braces). It is not
# part of the deployed application; remove this entry once a fixed braces version is published.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# v69: Next.js 16.4.3 fixes critical advisories (GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr: unauthenticated RCE in
# next <=16.4.0) and was installed before the minimum release age had passed; these entries can go once it has.
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3
  - '@next/eslint-plugin-next@16.4.3'
  - eslint-config-next@16.4.3

# GHSA-68fv-2mgg-jv7q: source-map-js <1.2.2 (via next → postcss).
overrides:
  source-map-js: ">=1.2.2"
# GHSA-mrhx-c7xc-m3w5: zod <4.6.6 can exhaust memory on oversized constrained collections (also via @anthropic-ai/sdk).
  zod: ">=4.6.6"
